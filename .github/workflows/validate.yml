name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Go template dependencies are in sync
        run: go run ./cmd/sync-go-template-deps --check

      - name: Generated examples are up to date
        run: go run ./cmd/generate-examples --check

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build generated Go example
        working-directory: examples/simple-go
        run: go build ./...

      - name: No stray POST_QUICKSTART.md or .embed files under examples
        run: |
          matches=$(find examples -name '*POST_QUICKSTART.md' -o -name '*.embed')
          if [ -n "$matches" ]; then
            echo "Unexpected files under examples/:"
            echo "$matches"
            exit 1
          fi

      - name: No unrendered template directives under examples
        run: |
          if grep -Rn '{{' examples; then
            echo "Unrendered template directives found under examples/"
            exit 1
          fi
