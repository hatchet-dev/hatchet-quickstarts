version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 30
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directories:
      - "/examples/simple-go"
      - "/examples/use-cases/scheduled/go"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 2
    groups:
      go-modules:
        patterns: ["*"]
        update-types: ["patch", "minor"]

  - package-ecosystem: "pip"
    directories:
      - "/examples/simple-python"
      - "/examples/use-cases/scheduled/python"
      - "/templates/python/poetry"
      - "/templates/python/pip"
      - "/templates/use-cases/scheduled/python/poetry"
      - "/templates/use-cases/scheduled/python/pip"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      python-examples:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/examples/simple-typescript"
      - "/examples/use-cases/scheduled/typescript"
      - "/templates/typescript/npm"
      - "/templates/typescript/pnpm"
      - "/templates/typescript/yarn"
      - "/templates/typescript/bun"
      - "/templates/use-cases/scheduled/typescript/npm"
      - "/templates/use-cases/scheduled/typescript/pnpm"
      - "/templates/use-cases/scheduled/typescript/yarn"
      - "/templates/use-cases/scheduled/typescript/bun"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      typescript-examples:
        patterns: ["*"]
