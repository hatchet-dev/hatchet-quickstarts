version: 2

# Templates ship no lockfiles and render the Go SDK version from CLI data, so
# only the generated examples carry pinned dependencies. Dependabot keeps them
# current; CI installs and e2e-runs them, proving the templates still work
# against the latest SDKs.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 30
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directories:
      - "/examples/simple-go"
      - "/examples/use-cases/scheduled/go"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 2
    groups:
      go-modules:
        patterns: ["*"]
        update-types: ["patch", "minor"]

  - package-ecosystem: "pip"
    directories:
      - "/examples/simple-python"
      - "/examples/use-cases/scheduled/python"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      python-examples:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/examples/simple-typescript"
      - "/examples/use-cases/scheduled/typescript"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      typescript-examples:
        patterns: ["*"]
