dev:
  preCmds: ["poetry install"]
  runCmd: "poetry run python src/worker.py"
  files:
    - "**/*.py"
    - "!**/__pycache__/**"
    - "!.venv/**"
  reload: true
triggers:
  - name: "manual-run"
    command: "poetry run python src/run.py"
    description: "Run the scheduled workflow once on demand"
